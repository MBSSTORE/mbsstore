<!-- ============ MBS STORE · PREMIUM INTRO ANIMATION (pure CSS + settings-driven) ============ -->
<style>
.mbs-intro{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;overflow:hidden;background:linear-gradient(180deg,#fffdf4 0%,#fef9e7 55%,#ffffff 100%);animation:mbsIntroOut .6s ease 3.4s forwards;will-change:opacity,visibility}
@keyframes mbsIntroOut{to{opacity:0;visibility:hidden;pointer-events:none}}
.mbs-intro-blob{position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none}
.mbs-intro-blob.b1{width:340px;height:340px;left:-90px;top:-90px;background:rgba(15,122,74,.16);animation:mbsIntroDrift 5s ease-in-out infinite alternate}
.mbs-intro-blob.b2{width:300px;height:300px;right:-80px;bottom:-80px;background:rgba(255,183,77,.28);animation:mbsIntroDrift 6s ease-in-out infinite alternate-reverse}
@keyframes mbsIntroDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(24px,18px) scale(1.06)}}
/* ---- OLD STYLE: 2D fruits orbit fast around the logo, then fly out for the reveal ---- */
.mbs-intro-stage{position:relative;display:flex;align-items:center;justify-content:center;width:min(88vw,560px);height:min(88vw,560px)}
.mbs-intro-orbit{position:absolute;inset:0;pointer-events:none;animation:mbsOrbitOut .45s ease 1.75s forwards;--r:min(36vw,240px)}
.mbs-intro-orbit::before{content:"";position:absolute;inset:6%;border:1.5px dashed rgba(15,122,74,.28);border-radius:50%}
@keyframes mbsOrbitOut{to{opacity:0;visibility:hidden;transform:scale(1.25)}}
.mbs-intro-spin{position:absolute;inset:0;animation:mbsSpin .95s linear infinite}
@keyframes mbsSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.mbs-intro-orbit i{position:absolute;left:50%;top:50%;font-style:normal;font-size:clamp(38px,7.5vw,60px);line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));will-change:transform}
.mbs-intro-orbit i:nth-child(1){transform:rotate(0deg) translate(var(--r)) rotate(0deg) translate(-50%,-50%)}
.mbs-intro-orbit i:nth-child(2){transform:rotate(45deg) translate(var(--r)) rotate(-45deg) translate(-50%,-50%)}
.mbs-intro-orbit i:nth-child(3){transform:rotate(90deg) translate(var(--r)) rotate(-90deg) translate(-50%,-50%)}
.mbs-intro-orbit i:nth-child(4){transform:rotate(135deg) translate(var(--r)) rotate(-135deg) translate(-50%,-50%)}
.mbs-intro-orbit i:nth-child(5){transform:rotate(180deg) translate(var(--r)) rotate(-180deg) translate(-50%,-50%)}
.mbs-intro-orbit i:nth-child(6){transform:rotate(225deg) translate(var(--r)) rotate(-225deg) translate(-50%,-50%)}
.mbs-intro-orbit i:nth-child(7){transform:rotate(270deg) translate(var(--r)) rotate(-270deg) translate(-50%,-50%)}
.mbs-intro-orbit i:nth-child(8){transform:rotate(315deg) translate(var(--r)) rotate(-315deg) translate(-50%,-50%)}
.mbs-intro-logo{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transform:scale(.62);animation:mbsIntroLogo .7s cubic-bezier(.2,.9,.3,1.25) 1.65s both;will-change:opacity,transform}
@keyframes mbsIntroLogo{from{opacity:0;transform:scale(.62) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
.mbs-intro-logo::after{content:"";position:absolute;inset:-8px -40px;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.85) 50%,transparent 58%);transform:translateX(-130%);animation:mbsShine .8s ease 2.25s forwards;pointer-events:none}
@keyframes mbsShine{to{transform:translateX(130%)}}
.mbs-intro-logoimg{width:min(420px,80vw);height:auto;display:block;filter:drop-shadow(0 14px 26px rgba(0,0,0,.14))}
.mbs-intro-namefb{display:none;font-weight:900;font-size:clamp(30px,7vw,44px);letter-spacing:.02em;line-height:1;color:#0f7a4a}
.mbs-intro-tagline{margin-top:16px;font-size:clamp(15px,3.6vw,20px);font-weight:600;letter-spacing:.04em;color:#5a6b5f;text-align:center;padding:0 20px;opacity:0;animation:mbsIntroFadeUp .6s ease 2.15s both}
@keyframes mbsIntroFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.mbs-intro-load{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;animation:mbsIntroFadeUp .6s ease 2.05s both}
.mbs-intro-track{width:min(220px,58vw);height:4px;border-radius:999px;background:#e9e2c4;overflow:hidden}
.mbs-intro-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#0f7a4a,#22a06b);animation:mbsIntroBar 1.6s cubic-bezier(.3,.7,.3,1) 2.1s forwards}
@keyframes mbsIntroBar{from{width:0}to{width:100%}}
.mbs-intro-loadtext{font-size:13px;font-weight:600;color:#8a8f88;letter-spacing:.02em;animation:mbsIntroPulse 1.6s ease-in-out 2.2s infinite}
@keyframes mbsIntroPulse{0%,100%{opacity:.65}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .mbs-intro,.mbs-intro *{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important}
  .mbs-intro{opacity:0;visibility:hidden;pointer-events:none}
}
</style>

<script>
/* MBS intro: reads Entry Animation settings saved by the admin panel (mbs_settings_local).
   If animation is OFF, the intro is hidden instantly. Preview button in admin sets
   sessionStorage mbs_intro_preview=1 and reloads, which forces one play-through. */
(function(){
  var el=document.getElementById('mbsIntro'); if(!el) return;
  var preview=false; try{ preview=sessionStorage.getItem('mbs_intro_preview')==='1'; if(preview) sessionStorage.removeItem('mbs_intro_preview'); }catch(e){}
  var s={}; try{ var raw=localStorage.getItem('mbs_settings_local'); if(raw) s=JSON.parse(raw)||{}; }catch(e){}
  function hideNow(){ el.style.display='none'; }
  if(s.introEnabled===false && !preview){ hideNow(); return; }
  try{
    var img=document.getElementById('mbsIntroLogoImg');
    if(img && s.introLogoUrl) img.src=s.introLogoUrl;
    if(img && s.introLogoWidth) img.style.width='min('+s.introLogoWidth+'px,80vw)';
    var tg=document.getElementById('mbsIntroTagline'); if(tg && typeof s.introTagline==='string') tg.textContent=s.introTagline;
    var lt=document.getElementById('mbsIntroLoadText'); if(lt && typeof s.introLoadingText==='string') lt.textContent=s.introLoadingText;
    if(s.introShowItems===false){ var it=document.getElementById('mbsIntroItems'); if(it) it.style.display='none'; }
    if(s.introShowProgress===false){ var ld=document.getElementById('mbsIntroLoad'); if(ld) ld.style.display='none'; }
    if(s.introBg1 || s.introBg2) el.style.background='linear-gradient(180deg,'+(s.introBg1||'#fffdf4')+' 0%,'+(s.introBg2||'#fef9e7')+' 55%,#ffffff 100%)';
    var dur=Number(s.introDuration); if(!dur || dur<2) dur=4; if(dur>8) dur=8;
    el.style.animation='mbsIntroOut .6s ease '+(dur-0.6).toFixed(2)+'s forwards';
    var fill=document.getElementById('mbsIntroFill'); if(fill) fill.style.animationDuration=Math.max(0.8,(dur-2.6)).toFixed(2)+'s';
  }catch(e){}
  /* Safety net: if CSS animations never ran, hide after 5s so the site is never blocked. */
  setTimeout(function(){ try{ if(el && getComputedStyle(el).visibility!=='hidden' && el.style.display!=='none'){ el.style.opacity='0'; el.style.visibility='hidden'; el.style.pointerEvents='none'; } }catch(e){} },5000);
})();
</script>

<!-- MBS FIX v2: measure real top-strip height (it wraps on mobile) so header sticks exactly below it -->
<script>
(function(){
  function measure(){
    var topbar = document.querySelector('div.bg-\[var\(--green-dark\)\]');
    var header = document.querySelector('header[data-safe-area-sticky-top]');
    if(!topbar || !header) return;
    var th = Math.ceil(topbar.getBoundingClientRect().height);
    var hh = Math.ceil(header.getBoundingClientRect().height);
    if(th > 0) document.documentElement.style.setProperty('--mbs-topbar-h', th + 'px');
    if(th > 0 && hh > 0) document.documentElement.style.setProperty('--mbs-fixed-total', (th + hh) + 'px');
  }
  function start(){
    measure();
    setTimeout(measure, 300); setTimeout(measure, 1200);
    window.addEventListener('resize', measure);
    window.addEventListener('orientationchange', function(){ setTimeout(measure, 300); });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
